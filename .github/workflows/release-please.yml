# Release-proposal maintenance (ADR 0018 §1; spec-release-pipeline-015 C3
# "Ownership consequence"): this workflow opens and updates the release PR —
# it never tags, never creates a GitHub Release and never publishes
# (`skip-github-release: true` in release-please-config.json). Tag + GitHub
# Release + publish + tarball assets are owned by `release.yml`.
#
# Default GITHUB_TOKEN on purpose (checklist mandate): release-please uses it
# for the PR, and GitHub's recursion rule ("events triggered by the
# GITHUB_TOKEN will not create a new workflow run") is exactly what keeps this
# workflow from looping on its own PR pushes. Consequence, documented in
# release.md: pull_request runs on a GITHUB_TOKEN-created PR start in an
# approval-required state — a write-access user clicks "Approve workflows"
# once and the runs start.
#
# The release itself is proposed by a human: push a `Release-As: X.Y.Z`
# trailer commit to main (empty commit allowed — no conventional-commit
# dependency, spec C2). Merging the release PR is the release.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Surface an aborted release (release-please found no tag for a merged release PR)
        # bug-release-config-workflow-agreement-ungated: release-please can ABORT
        # with only a `logger.warn` while the job reports success — that
        # warned-and-succeeded shape kept the release pipeline dead from
        # 2026-10-02 to 2026-10-07 behind green runs nobody could read as failure.
        # This step turns the abort into a red run. Its predicate is
        # release-please's OWN (src/manifest.ts): a MERGED release PR still
        # carrying `autorelease: pending` — findMergedReleasePullRequests() →
        # "There are untagged, merged release PRs outstanding - aborting". The
        # logic is a tested, injectable-gh script (cli/release-abort-check.mjs),
        # not inline shell, and it runs on EVERY push with no `if:`. It cannot
        # go red on a legitimate no-release push: on such a push no release PR is
        # merged and every already-merged one has had its label flipped to
        # `autorelease: tagged`, so the query is empty (the green path is proven
        # in cli/release-abort-check.test.ts). An OPEN release PR is excluded by
        # `--state merged`; a gh query failure warns and exits 0 rather than cry
        # wolf on a healthy push. The tag↔config agreement that causes the abort
        # is pinned by cli/src/release-config-agreement.test.ts.
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node cli/release-abort-check.mjs --repo "$GITHUB_REPOSITORY"

      - name: Surface a non-lockstep release PR (root and lib versions must move together)
        # bug-release-proposal-non-lockstep-undetected: release-please bumps only
        # the components whose paths a wave touched, so it can auto-propose a
        # root-only bump (#764: root 0.8.0, lib 0.7.1) while
        # release-please-config.json's extra-files rule rewrites the root's
        # kernel pin assuming lockstep. That proposal must never merge —
        # release.yml refuses to tag it — but its only red surface was the PR's
        # own approval-gated CI, so #764 sat undetected until a human approved
        # the runs. This step reads both package.json versions AT the PR's head
        # ref and reddens the maintenance run when they differ, naming both
        # versions and the empty `Release-As: X.Y.Z` remedy. The logic is the
        # tested, injectable-gh script cli/release-lockstep-check.mjs
        # (cli/release-lockstep-check.test.ts witnesses the green and red paths
        # offline). It runs on EVERY push with no `if:`, BEFORE the lockfile
        # sync below — a non-lockstep proposal must fail before this workflow
        # mutates its branch. No open PR and a lockstep proposal are silent; a
        # gh query/read failure warns and exits 0 rather than cry wolf (the
        # pre-tag gate in release.yml is the backstop).
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node cli/release-lockstep-check.mjs --repo "$GITHUB_REPOSITORY"

      # release-please does not update lockfiles (googleapis/release-please#1993,
      # open): the release PR bumps both package versions and rewrites the root's
      # kernel dependency to the exact released version, so an unsynced
      # package-lock.json would desync the PR and `npm ci` on it would be red.
      # This step is the issue-#1993 workaround: whenever a release PR is open,
      # check out its branch, recompute the lockfile (no install — workspace
      # links resolve the not-yet-published version locally) and push it onto
      # the PR branch. release-please's own later branch updates are re-synced
      # by the next run of this step; the push starts no new workflow runs
      # (GITHUB_TOKEN recursion rule) and only updates the PR.
      #
      # `--ignore-scripts` is load-bearing, not tidiness: `npm install
      # --package-lock-only` still runs the root `prepare` (`npm run build`), and
      # that build needs a toolchain (`tsc`, `@types/node`) this workflow never
      # installs — every run with an open release PR died on it: 49 failures,
      # from the workflow's first run (36908073600, 2026-10-01, which created PR
      # #556) through 38283343454 (bug-release-lockfile-sync-step-cannot-run).
      # The flag suppresses lifecycle scripts only: resolution is byte-identical
      # with and without it (registry tarballs + the local `lib` workspace link;
      # the tree has no git dependency whose build the install would need).
      # Keep the step fail-loud — npm rewrites package-lock.json even when a
      # lifecycle script then fails, so swallowing the exit code would commit a
      # lockfile whose install was never proven.
      #
      # PR discovery keys off the manifest-mode branch name default
      # (`release-please--branches--main`, manifest-releaser.md) rather than the
      # action's created-only outputs, so updates and re-syncs take the same
      # path as creation. Changing `branch-name` in the config breaks this
      # lookup — keep them in sync.
      - name: Sync package-lock.json onto the release PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --head 'release-please--branches--main' \
            --json headRefName --jq '.[].headRefName' | head -n1)"
          if [ -z "$branch" ]; then
            echo "no open release PR - nothing to sync"
            exit 0
          fi
          echo "release PR branch: $branch"
          git fetch --force origin "refs/heads/$branch:refs/remotes/origin/$branch"
          git checkout -B "$branch" "origin/$branch"
          npm install --package-lock-only --ignore-scripts
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage BY PATH: the install only writes the working tree, so a bare
          # `git commit` fails with "Changes not staged for commit" — run
          # 38292422896 died exactly there (bug-release-lockfile-sync-step-
          # cannot-run). Explicit path, never `git add -A`, so the commit can
          # only ever carry package-lock.json.
          git add package-lock.json
          git commit -m "chore: sync package-lock.json with the release PR versions"
          git push origin "HEAD:refs/heads/$branch"
