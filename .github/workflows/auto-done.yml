name: auto-done

# Mirrors `arggon start`, which automates the claim side (in_progress +
# assignee + branch + PR): when a PR referencing task/bug items merges, this
# flips those items to done through the CLI update path and commits the status
# change to main. Only the legal in_progress -> done transition is performed;
# anything else (unclaimed items, containers, unknown ids) is skipped with a
# warning annotation. Acceptance checklists stay a human/agent responsibility.
# Context: ArggonManager/arggon-manager/cli/story-github/task-auto-done-on-merge.md

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  # write: the landing flow opens the flip PR (and merges it) as the bot.
  pull-requests: write
  # write: post the required `cli` check run on the flip commit (see below).
  checks: write

jobs:
  auto-done:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.pull_request.merged == true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Collect task/bug ids referenced by the merged PR
        id: ids
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          text="$(gh pr view "$PR" --json title,body --jq '.title + " " + (.body // "")')"
          ids="$(printf '%s' "$text" | grep -oE '\b(task|bug)-[a-z0-9]+(-[a-z0-9]+)*\b' | sort -u || true)"
          {
            echo 'ids<<EOF'
            printf '%s\n' "$ids"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "referenced ids: ${ids:-none}"

      - name: Flip claimable leaves to done and land via PR
        env:
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          # Multiline via env, never ${{ }} interpolation: a raw multiline
          # output inside `for id in ...` breaks bash parsing (the newline
          # closes the word list before `; do`).
          IDS: ${{ steps.ids.outputs.ids }}
        run: |
          # Re-fetch and re-checkout main immediately before the flip loop
          # (task-cascade-subtree-open-visibility): the checkout above pinned
          # main at run START, so a sibling's flip PR merging minutes later was
          # invisible to the loop (the race behind task-auto-done-cascade-
          # visibility). Fast-forward to origin/main here to shrink the window.
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          changed=0
          for id in $IDS; do
            status="$(node dist/cli.js list --json | jq -r --arg id "$id" '.items[] | select(.id == $id) | .status')"
            case "$status" in
              in_progress)
                # Capture the update JSON (task-auto-done-cascade-visibility):
                # autoCompleted/cascadeSkipped must land in the run log so a
                # missed cascade is diagnosable after the fact. A sibling that
                # is still non-terminal on THIS tree (e.g. its own flip PR had
                # not merged when this run checked out main) stops the cascade
                # — recorded as a cascadeSkipped entry with reason
                # subtree-open naming the blocking sibling.
                if out="$(node dist/cli.js update "$id" --status done --json)"; then
                  cascade="$(printf '%s' "$out" | jq -r '(.autoCompleted // []) | join(",")' 2>/dev/null || true)"
                  skipped="$(printf '%s' "$out" | jq -r '(.cascadeSkipped // []) | map("\(.id):\(.reason)") | join(",")' 2>/dev/null || true)"
                  echo "$id (PR #$PR): in_progress -> done (cascade: ${cascade:-none}${skipped:+; skipped: $skipped})"
                  changed=1
                else
                  echo "::warning::$id: update failed unexpectedly (output: ${out:-empty})"
                fi
                ;;
              done|cancelled)
                echo "skip $id: already $status"
                ;;
              todo|blocked)
                echo "::warning::$id is $status: $status -> done is not a legal v0 transition (claim first, then merge, or mark manually)"
                ;;
              "")
                echo "skip $id: not found in the tracker (external reference?)"
                ;;
            esac
          done

          if [ "$changed" = 1 ]; then
            # main is protected with the required `cli` check, and GITHUB_TOKEN
            # pushes/PRs never trigger workflows (recursion guard), so no check
            # would ever appear on a bot push or bot PR. Instead: run the cli
            # suite here on the exact flip tree, push the branch, and post the
            # `cli` check run ourselves as github-actions[bot] (app 15368, the
            # same app the protection pins). Squash: linear history.
            npm test --silent && npm run lint --silent
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ArggonManager/
            if git diff --cached --quiet; then echo "no status flips to commit"; exit 0; fi
            git commit -m "chore(auto): mark items done (PR #$PR merged)"
            branch="chore/auto-done-${GITHUB_RUN_ID}"
            git push origin "HEAD:$branch"
            # Post-check + merge-with-retry (task-autodone-flip-race): when
            # several PRs merge in rapid succession, sibling auto-done runs
            # (and coordinator review comments) land on main while this flip
            # PR is open, so main's "up to date" branch protection rejects
            # the self-merge. A wedged flip cannot be fixed by update-branch
            # (the rebased head would lack the required `cli` check; bot
            # pushes never trigger CI) — only an admin bypass cleared it.
            # So: bounded loop that, before each merge attempt, refreshes
            # main, rebases the flip branch if behind, RE-POSTS the `cli`
            # check on the new head sha, and retries the merge. A rebase can
            # CONFLICT (task-autodone-flip-wedge-3): when the coordinator
            # posts a review via `arggon comment` on an item being flipped
            # mid-flight, the comment auto-commits that same item file to
            # main while the flip branch carries its own version (claim
            # frontmatter + ticks). That case no longer wedges: the rebase
            # failure path REDOs the flip on a fresh main checkout (see
            # redo_flip below) instead of abandoning to an admin.
            post_cli_check() {
              gh api "repos/$GITHUB_REPOSITORY/check-runs" \
                -f name=cli -f head_sha="$1" \
                -f status=completed -f conclusion=success > /dev/null
              echo "posted cli check run on $1"
            }
            # (task-autodone-flip-wedge-3) Recovery for same-file conflicts:
            # re-run the whole flip from a FRESH origin/main checkout in a
            # temp worktree, push a NEW flip branch (unique suffix so it can
            # never collide with the wedged one), post the `cli` check on the
            # new head, and squash-merge it. The flip update is idempotent
            # from a clean tree — already-done ids skip cleanly — and per-id
            # outcomes are still logged. The temp worktree is removed ALWAYS
            # (success or failure) and the old wedged branch is deleted after
            # the redo merge lands. Returns 0 when main no longer needs the
            # original flip (redo merged, or items already done on main).
            redo_flip() {
              local suffix="$1" tmp newbranch rc=1
              tmp="$(mktemp -d /tmp/auto-done-redo.XXXXXX)"
              newbranch="chore/auto-done-${GITHUB_RUN_ID}-${suffix}"
              if git worktree add --detach "$tmp" origin/main; then
                if (
                  cd "$tmp" &&
                  git config user.name "github-actions[bot]" &&
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com" &&
                  npm ci --silent && npm run build --silent &&
                  changed2=0
                  for rid in $IDS; do
                    rstatus="$(node dist/cli.js list --json | jq -r --arg id "$rid" '.items[] | select(.id == $id) | .status')"
                    case "$rstatus" in
                      in_progress)
                        if out2="$(node dist/cli.js update "$rid" --status done --json)"; then
                          cascade2="$(printf '%s' "$out2" | jq -r '(.autoCompleted // []) | join(",")' 2>/dev/null || true)"
                          skipped2="$(printf '%s' "$out2" | jq -r '(.cascadeSkipped // []) | map("\(.id):\(.reason)") | join(",")' 2>/dev/null || true)"
                          echo "$rid (redo, PR #$PR): in_progress -> done (cascade: ${cascade2:-none}${skipped2:+; skipped: $skipped2})"
                          changed2=1
                        else
                          echo "::warning::$rid: redo update failed unexpectedly (output: ${out2:-empty})"
                        fi
                        ;;
                      done|cancelled)
                        echo "skip $rid (redo): already $rstatus"
                        ;;
                      *)
                        echo "::warning::$rid (redo): status '${rstatus:-missing}' — not flipped"
                        ;;
                    esac
                  done
                  if [ "$changed2" != 1 ]; then
                    echo "redo: no status flips to commit (items already done on main?)"
                    exit 2
                  fi
                  git add ArggonManager/
                  # The CLI may auto-commit the flip itself (it did in the
                  # wedge-3 repro), so an empty staged tree is NOT a failure.
                  if ! git diff --cached --quiet; then
                    git commit -m "chore(auto): mark items done (PR #$PR merged, redo ${suffix})"
                  fi
                  git rev-parse HEAD >/dev/null && git push origin "HEAD:$newbranch"
                ); then
                  redo_inner=$?
                else
                  redo_inner=$?
                fi
                if [ "$redo_inner" = 2 ]; then
                  # Nothing to flip: main already has the items done (e.g. the
                  # comment race itself closed them out). The wedge is moot.
                  git push origin --delete "$branch" 2>/dev/null || true
                  rc=0
                elif [ "$redo_inner" = 0 ]; then
                  git fetch origin "$newbranch"
                  newsha="$(git rev-parse FETCH_HEAD)"
                  post_cli_check "$newsha"
                  gh pr create \
                    --head "$newbranch" --base main \
                    --title "chore(auto): mark items done (PR #$PR merged, ${suffix})" \
                    --body "Automated redo of the in_progress -> done flip for: $IDS (source PR #$PR) after a rebase conflict on the original flip branch."
                  sleep 10
                  if gh pr merge "$newbranch" --squash; then
                    echo "redo merge landed on $newbranch; deleting wedged branch $branch"
                    git push origin --delete "$branch" 2>/dev/null || true
                    rc=0
                  else
                    echo "redo: merge of $newbranch failed (likely out-of-date race)"
                  fi
                fi
              else
                echo "::warning::redo: could not create temp worktree at $tmp"
              fi
              git worktree remove --force "$tmp" 2>/dev/null || true
              git worktree prune
              rm -rf "$tmp"
              return "$rc"
            }
            sha="$(git rev-parse HEAD)"
            post_cli_check "$sha"
            gh pr create \
              --head "$branch" --base main \
              --title "chore(auto): mark items done (PR #$PR merged)" \
              --body "Automated in_progress -> done flip for: $IDS (source PR #$PR)."
            # Freshly created PRs may not have the posted check registered
            # against protection yet; give it a moment before the first try.
            sleep 10
            merge_ok=0
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git merge-base --is-ancestor origin/main HEAD; then
                echo "attempt $attempt: $branch is behind main; rebasing onto origin/main"
                if ! git rebase origin/main; then
                  git rebase --abort
                  echo "rebase of $branch onto origin/main conflicted (expected when main touched the same item files mid-flight); attempting redo on fresh main"
                  redo_ok=0
                  for redo in 1 2; do
                    if redo_flip "redo${redo}"; then
                      redo_ok=1
                      echo "redo attempt $redo recovered the flip"
                      break
                    fi
                    echo "redo attempt $redo failed; retrying with a fresh worktree"
                  done
                  if [ "$redo_ok" != 1 ]; then
                    echo "::warning::rebase of $branch onto origin/main failed AND the redo-on-fresh-main recovery failed after 2 attempts; recovery: admin-merge the flip PR"
                  fi
                  break
                fi
                git push --force-with-lease origin "HEAD:$branch"
                sha="$(git rev-parse HEAD)"
                post_cli_check "$sha"
              fi
              if gh pr merge "$branch" --squash; then
                merge_ok=1
                echo "merged $branch on attempt $attempt"
                break
              fi
              echo "attempt $attempt: merge of $branch failed (likely out-of-date race); retrying"
              sleep 15
            done
            if [ "$merge_ok" != 1 ]; then
              echo "::warning::could not self-merge $branch after 3 attempts (up-to-date race); recovery: admin merge the flip PR (the required cli check is posted on its head)"
            fi
          else
            echo "no status flips to commit"
          fi
