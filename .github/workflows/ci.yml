name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fail if package.json version is already tagged (release forgotten)
        # PRs only: on main this would stay red between a tag and the next
        # bump, wedging every tracker commit and auto-done flip in between.
        # And only when the PR touches package.json: tracker-only flip PRs
        # must never be blocked by the version guard.
        #
        # bug-ci-version-guard-dev-only: the demand is scoped to the
        # publish-relevant fields (name/version/private/bin/files/dependencies/
        # engines — cli/version-guard.mjs). A devDependency or script change is
        # not adopter-facing and must not force a release bump; a shipping-field
        # change while the version is already tagged still fails.
        #
        # The default checkout is shallow, so `origin/main...HEAD` had no merge
        # base and the old inline check silently passed on every PR. Fetch the
        # PR's own base commit by SHA instead (exact, ancestry-free) and compare
        # trees two-dot; the file list and the base content come from it.
        if: github.event_name == 'pull_request'
        run: |
          git fetch --tags --force
          base='${{ github.event.pull_request.base.sha }}'
          git fetch --no-tags --depth=1 origin "$base"
          if ! git diff --name-only FETCH_HEAD HEAD | grep -q '^package\.json$'; then exit 0; fi
          git show FETCH_HEAD:package.json > "$RUNNER_TEMP/package-base.json"
          node cli/version-guard.mjs "$RUNNER_TEMP/package-base.json"
      - run: npm run build
      - name: Fail if the committed plugin bundle drifted from its source
        # The artifact is committed and vendored to adopters by `init`; the
        # build above regenerates it, so a diff against HEAD means the source
        # changed without `npm run build:plugin` (review F1, PR #376).
        run: npm run check:plugin
      - run: npm run test
      - run: npm run lint
      - run: npm run test:structure
      - run: npm run lint:structure
      - name: "Spec pipeline: zero NEW findings vs the ADR 0017 baseline"
        # task-ci-required-check-missing-spec-analyze-baseline: the repo-root
        # baseline lane — the shared ADR 0017 zero-NEW gate — ran nowhere a
        # human sees before merge. `spec analyze` appeared in NO workflow
        # (`grep -rn "spec analyze" .github/` was empty), there is no
        # pre-commit hook, and the only required check on main is `cli`, which
        # did not run it. So the lane exited 1 on main for five days
        # (2026-10-06 → 2026-10-11) and the only thing that noticed was a
        # manual reproduction in a work-item comment. It runs here, in the job
        # that is already required on main, so a NEW finding reddens the check
        # that gates the merge instead of a log nobody reads.
        #
        # Why THIS job and not the `arggon` workflow's `tasks-validate` job:
        # that job installs the RELEASED bin
        # (`npm install -g arggon-manager@$ARGGON_VERSION`), so a detector
        # change in this checkout cannot fail a gate until the release carrying
        # it ships — exactly the lag that hid this lane (the PR whose detector
        # change made 5 findings visible merged green; the lane only went red
        # days later, when someone ran the command by hand). `cli` runs
        # `npm run arggon` = `tsx cli/src/cli.ts` — THIS checkout's source — so
        # the gate bites on the very commit that moved the detector or the
        # corpus, with no release window in between. It also needs nothing the
        # job above does not already provide: `npm ci` (node_modules) and the
        # build; it is offline, model-free and ~0.3 s locally.
        #
        # BLOCKING on purpose: the job shell is `bash -e`, so the gate's exit
        # code (>= 1 NEW finding, or a structural SPEC_FAILED) fails this step
        # and the job. Deliberately no `continue-on-error`, no `|| true` and no
        # advisory `if:` — that is what makes it a gate.
        #
        # Only the repo-root baseline is wired. The release-pipeline story's
        # `ArggonManager/docs/specs/spec-analyze-baseline-release-pipeline-015.json`
        # is a snapshot of the same whole-corpus scan and carries the identical
        # finding set (4 entries, field-for-field), so a second step would
        # re-run one scan and print the same answer — a duplicate lane whose
        # only effect is a second place to go stale. One corpus, one baseline,
        # one lane; the story-scoped file stays owned by that story.
        #
        # Placed after `lint:structure` (the other docs-side structural gates)
        # and before the smoke steps, whose recorded rationale is "cheap and
        # last: a failing run keeps its fixture for inspection, with nothing
        # after it".
        run: npm run arggon -- spec analyze --baseline ArggonManager/spec-analyze-baseline.json
      - name: "Paired-deletion guard: a D row that takes an implementation AND its test"
        # bug-no-gate-warns-on-paired-impl-and-test-deletion: the silent shape.
        # `npm test` / `npm run build` fire when a deletion breaks compilation
        # or orphans a test; deleting an implementation AND its paired test in
        # one change leaves nothing to fail and goes green. PR #586 produced
        # exactly that pair (`D cli/src/adapters.ts` +
        # `D cli/src/adapter-selection.test.ts`) and the only reason anyone
        # could tell was manual `git diff --name-status` inspection.
        #
        # REPORT-ONLY on purpose, and this is the recorded decision. A paired
        # deletion is a legitimate, reviewed refactor step as often as it is an
        # accident — measured over the last 500 commits of this repo it occurs
        # ZERO times out of 40 `D` rows, so a blocking gate would buy nothing
        # today and would cost a `continue-on-error`-shaped bypass on the first
        # intentional module removal. The `cli` shell is `bash -e`, so the step
        # still fails on the one thing that must fail: a run that COULD NOT
        # look. `node cli/paired-deletion-guard.mjs` exits 2 on an unresolvable
        # base or no merge base — never a quiet pass, which is the vacuity
        # bug-verification-regex-matching-nothing is about. Deliberately no
        # `|| true` and no `continue-on-error`: the only exit code this step
        # may produce on a healthy run is 0, and 2 means "the fetch is wrong".
        # Promoting it to blocking is `--strict` plus its own call.
        #
        # THREE-DOT, always. The guard diffs merge-base -> head. A two-dot
        # comparison against a base that moved ahead of the branch point
        # reports every file the base gained as `D` on the branch side — a
        # paired deletion that never happened, i.e. the #586 false positive,
        # recreated by the gate itself. The default checkout is shallow, so both
        # sides are fetched by SHA with enough depth for `git merge-base` to
        # find the real branch point; the guard prints the merge base it used
        # and warns when that base sits on the shallow boundary.
        #
        # PR-only: a `push` run has no base branch name to fetch, and
        # main-vs-main is empty by construction.
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=250 origin \
            "+${{ github.event.pull_request.base.sha }}:refs/remotes/pull/base" \
            "+${{ github.event.pull_request.head.sha }}:refs/remotes/pull/head"
          node cli/paired-deletion-guard.mjs --base refs/remotes/pull/base --head refs/remotes/pull/head
      - name: Native start cold-start smoke (tools.arggon.start worktree path)
        # task-wire-native-start-cold-smoke-into-ci: the deterministic,
        # MODEL-FREE gate for the native worktree/start path, run in this job
        # beside the other dev-only node gates (`test:structure`,
        # `lint:structure`) rather than as a lane of its own. It drives THIS
        # checkout's plugin source and kernel build, so it needs `npm run build`
        # above — it prints the two paths it resolved and exits 2 with an
        # actionable `npm run build` line when the build is missing.
        #
        # Why `cli` and not `ui-smoke`: it is offline, needs no provider, no
        # quota and no Chromium, and adds no second install. It is NOT the
        # model-driven `smoke:opencode` transcript, which stays the
        # runtime-level evidence and is run by maintainers (still quota-bound).
        #
        # Ordering is only constrained by the build above; the vitest `$TMPDIR`
        # purge is age-gated (2h) and suite-start-gated, so it cannot reap this
        # step's fixture even if it were ordered earlier. Cheap and last: a
        # failing run keeps its fixture for inspection, with nothing after it.
        # Observed runtime ~0.5s (5/5 local runs: 0.47-0.48s, 20/20 checks).
        #
        # BLOCKING on purpose: the job shell is `bash -e`, so a non-zero exit
        # fails this step and the job. Deliberately no `continue-on-error`, no
        # `|| true` and no advisory `if:` — that is what makes it a gate.
        run: npm run smoke:native-start-cold

      # bug-worktree-link-farm-breaks-playwright-runner: the review bar's
      # Playwright lane must start from a start-style link-farm worktree (the
      # layout every review worktree has). Model-free, offline, --list only;
      # BLOCKING like the gate above.
      - name: Playwright lane from a link-farm worktree
        run: npm run smoke:worktree-playwright

  ui-smoke:
    # task-ui-browser-smoke-ci (ADR 0008 tier 2): the durable `@smoke` browser
    # spec plus the pty TUI frame check. Chromium-only and one worker; the
    # review-time real-browser gate stays Playwright CLI on the reviewer side.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Chromium (Playwright is a devDependency, never shipped)
        run: npx playwright install --with-deps chromium
      - name: Browser smoke (board --serve on a temp fixture)
        run: npx playwright test --grep @smoke
      - name: TUI frame check (pty)
        run: npm run smoke:tui-board
