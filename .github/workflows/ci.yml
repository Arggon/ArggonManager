name: CI

on:
  push:
    branches: [main, opencode2]
  pull_request:
    branches: [main, opencode2]

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fail if package.json version is already tagged (release forgotten)
        # PRs only: on main this would stay red between a tag and the next
        # bump, wedging every tracker commit and auto-done flip in between.
        # And only when the PR touches package.json: tracker-only flip PRs
        # must never be blocked by the version guard.
        if: github.event_name == 'pull_request'
        run: |
          git fetch --tags --force
          if ! git diff --name-only origin/main...HEAD | grep -q '^package\.json$'; then exit 0; fi
          v=$(node -p "require('./package.json').version")
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then echo "version $v already tagged - bump package.json"; exit 1; fi
      - run: npm run build
      - run: npm run test
      - run: npm run lint
