name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fail if package.json version is already tagged (release forgotten)
        # PRs only: on main this would stay red between a tag and the next
        # bump, wedging every tracker commit and auto-done flip in between.
        # And only when the PR touches package.json: tracker-only flip PRs
        # must never be blocked by the version guard.
        #
        # bug-ci-version-guard-dev-only: the demand is scoped to the
        # publish-relevant fields (name/version/private/bin/files/dependencies/
        # engines — cli/version-guard.mjs). A devDependency or script change is
        # not adopter-facing and must not force a release bump; a shipping-field
        # change while the version is already tagged still fails.
        #
        # The default checkout is shallow, so `origin/main...HEAD` had no merge
        # base and the old inline check silently passed on every PR. Fetch the
        # PR's own base commit by SHA instead (exact, ancestry-free) and compare
        # trees two-dot; the file list and the base content come from it.
        if: github.event_name == 'pull_request'
        run: |
          git fetch --tags --force
          base='${{ github.event.pull_request.base.sha }}'
          git fetch --no-tags --depth=1 origin "$base"
          if ! git diff --name-only FETCH_HEAD HEAD | grep -q '^package\.json$'; then exit 0; fi
          git show FETCH_HEAD:package.json > "$RUNNER_TEMP/package-base.json"
          node cli/version-guard.mjs "$RUNNER_TEMP/package-base.json"
      - run: npm run build
      - name: Fail if the committed plugin bundle drifted from its source
        # The artifact is committed and vendored to adopters by `init`; the
        # build above regenerates it, so a diff against HEAD means the source
        # changed without `npm run build:plugin` (review F1, PR #376).
        run: npm run check:plugin
      - run: npm run test
      - run: npm run lint
      - run: npm run test:structure
      - run: npm run lint:structure
      - name: Native start cold-start smoke (tools.arggon.start worktree path)
        # task-wire-native-start-cold-smoke-into-ci: the deterministic,
        # MODEL-FREE gate for the native worktree/start path, run in this job
        # beside the other dev-only node gates (`test:structure`,
        # `lint:structure`) rather than as a lane of its own. It drives THIS
        # checkout's plugin source and kernel build, so it needs `npm run build`
        # above — it prints the two paths it resolved and exits 2 with an
        # actionable `npm run build` line when the build is missing.
        #
        # Why `cli` and not `ui-smoke`: it is offline, needs no provider, no
        # quota and no Chromium, and adds no second install. It is NOT the
        # model-driven `smoke:opencode` transcript, which stays the
        # runtime-level evidence and is run by maintainers (still quota-bound).
        #
        # Ordering is only constrained by the build above; the vitest `$TMPDIR`
        # purge is age-gated (2h) and suite-start-gated, so it cannot reap this
        # step's fixture even if it were ordered earlier. Cheap and last: a
        # failing run keeps its fixture for inspection, with nothing after it.
        # Observed runtime ~0.5s (5/5 local runs: 0.47-0.48s, 20/20 checks).
        #
        # BLOCKING on purpose: the job shell is `bash -e`, so a non-zero exit
        # fails this step and the job. Deliberately no `continue-on-error`, no
        # `|| true` and no advisory `if:` — that is what makes it a gate.
        run: npm run smoke:native-start-cold

      # bug-worktree-link-farm-breaks-playwright-runner: the review bar's
      # Playwright lane must start from a start-style link-farm worktree (the
      # layout every review worktree has). Model-free, offline, --list only;
      # BLOCKING like the gate above.
      - name: Playwright lane from a link-farm worktree
        run: npm run smoke:worktree-playwright

  ui-smoke:
    # task-ui-browser-smoke-ci (ADR 0008 tier 2): the durable `@smoke` browser
    # spec plus the pty TUI frame check. Chromium-only and one worker; the
    # review-time real-browser gate stays Playwright CLI on the reviewer side.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Chromium (Playwright is a devDependency, never shipped)
        run: npx playwright install --with-deps chromium
      - name: Browser smoke (board --serve on a temp fixture)
        run: npx playwright test --grep @smoke
      - name: TUI frame check (pty)
        run: npm run smoke:tui-board
