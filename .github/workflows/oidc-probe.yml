# THROWAWAY PROBE — tests whether the npm trusted-publisher relationship
# resolves, WITHOUT publishing. Runs a real `npm publish --dry-run` with the
# OIDC token presented, which is the exact code path a trusted publisher serves.
# (npm docs: `npm whoami` is NOT a check of trusted-publishing permissions.)
name: oidc-probe
on:
  pull_request:
    branches: [main]
permissions:
  id-token: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe the trusted publisher via the real publish path
        run: |
          npm install -g npm@latest
          echo "--- npm publish --dry-run (OIDC presented, nothing published) ---"
          npm publish --workspace lib --dry-run 2>&1 | tail -20
          echo "--- exit: $? ---"
