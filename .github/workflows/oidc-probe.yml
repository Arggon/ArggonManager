# THROWAWAY PROBE — tests whether the npm trusted-publisher relationship
# resolves, WITHOUT publishing anything. Runs `npm whoami` and `npm ping` only.
# Delete after use.
name: oidc-probe
on:
  pull_request:
    branches: [main]
permissions:
  id-token: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe the lib trusted publisher
        run: |
          npm install -g npm@latest
          echo "--- npm whoami (OIDC) ---"
          npm whoami 2>&1 || echo "RESULT: no OIDC identity"
          echo "--- npm ping ---"
          npm ping 2>&1 || true
