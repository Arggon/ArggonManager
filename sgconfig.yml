# Structural architecture guard. The CLI package is exact-pinned as a devDependency;
# these rules are repository policy, not runtime behavior or published assets.
ruleDirs:
  - tools/ast-grep/rules

testConfigs:
  - testDir: tools/ast-grep/tests

# TypeScript and TSX use distinct parsers. Treat the hand-authored .ts files as
# the TSX superset so one rule ID covers both without a second, drifting copy.
languageGlobs:
  tsx:
    - "**/*.ts"
    - "**/*.tsx"
