id: native-tools-use-shared-seam
valid:
  - |
    const TOOL_SPECS = [{ name: "list", description: "List", input: {}, output: {}, run }];
    const definitions = TOOL_SPECS.map((spec) => ({ ...spec, execute: spec.run }));
  - |
    const clients = new Set<string>();
    clients.add(client);
  - |
    export function register(kernel: Kernel) {
      return kernel.createOperation({ cwd: process.cwd() });
    }
  - |
    export async function registerArgonTools(ctx: PluginContext, kernel: Kernel, options: Options) {
      const transform = ctx?.tool?.transform;
      const definitions = argonToolDefinitions(kernel, options);
      await transform((editor) => {
        editor.namespace({ name: ARGON_TOOL_NAMESPACE, description: ARGON_TOOL_NAMESPACE_DESCRIPTION });
        for (const definition of definitions) {
          editor.add({
            ...definition,
            options: { namespace: ARGON_TOOL_NAMESPACE, codemode: true },
          });
        }
      });
    }
  - |
    export const Action = () => (
      <button onClick={() => kernel.listOperation({ cwd: "." })}>List</button>
    );
  - |
    // Deliberate computed/destructured indirection is outside this rule's scope.
    export function aliasedTransform(ctx: PluginContext) {
      const register = ctx.tool.transform;
      register((editor) => {});
    }
  - |
    export function arbitraryAlias(ctx: PluginContext) {
      const t = ctx?.tool?.transform;
      t((editor) => {});
    }
  - |
    // A renamed but type-valid receiver is outside the rule's scope — the
    // receiver names are structural anchors (documented native limitation;
    // the plugin schema/parity tests own renamed receivers).
    export function migrate(toolEditor: ToolEditorLike, extraTool: ToolDefinition) {
      toolEditor.add(extraTool);
    }
invalid:
