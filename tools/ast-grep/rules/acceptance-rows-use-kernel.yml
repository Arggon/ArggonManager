id: acceptance-rows-use-kernel
language: Tsx
severity: error
message: Acceptance-checkbox rows must come from the kernel (@arggondev/lib), not a local regex.
note: |
  Rationale: SIX hand-written acceptance-box grammars shipped before
  bug-three-acceptance-parsers-diverging — the gate plus five outside the
  kernel — and four of the outside ones disagreed with the DONE GATE
  (`acceptanceComplete`, lib/src/items.ts) on reachable shapes. The worst case
  was the inversion: a renderer reporting "nothing unchecked" on an item the
  gate refused to close. The kernel now owns the one row grammar
  (`acceptanceRows` / `acceptanceCriteria` / `acceptanceUnchecked`) and the one
  canonical body (`acceptanceBody`).

  WHAT IT CATCHES: a fifth GRAMMAR — code that recognises acceptance boxes itself.
  WHAT IT DOES NOT CATCH: a fifth wrong INPUT. Grammar shape says nothing about
  which bytes a consumer hands the kernel, so this rule would not have caught
  the comment-stripping or the LineTerminator bugs from the same item. Those are
  covered by cli/src/acceptance-parity.test.ts, which asserts each consumer
  reads `acceptanceBody(item)` and that the gate's verdict equals the pre-fix
  regex across corpus, real items, the live tracker and a 200k fuzz.

  This is a high-confidence structural guard, not semantic data-flow analysis.
  It fires on a regex literal whose character class holds ONLY task-box
  characters — a mix of space, tab, `x` and `X`: the spellings of `[ ]`,
  `[x]`, `[X]`, `[ x]`, `[ xX]`. Nothing else in a TypeScript regex looks like
  that, which is what keeps the false-positive rate at zero (the rule's own
  test suite pins valid and invalid spellings, and `npm run test:structure`
  runs the rule against the whole hand-authored tree on every gate).

  It matches the bracket group itself, so the group may also carry the `( )`
  and `|` of an alternation: `[ ]`, `[x]`, `[X]`, `[ x]`, `[ xX]`, `[( |x|X)]`,
  `[x|X]`, `\[[ ]\]` and `\[[xX]?\]` all fire. That is slightly BROADER than
  "the spellings the removed parsers used" — a regex that merely MENTIONS a box
  is flagged too — and the over-approximation is deliberate: a false positive
  costs one `acceptanceRows(...)` call. That is also why `lib/src/**` (the
  grammar's owner) and `**/*.test.ts` (where the parity suite keeps the PRE-FIX
  parsers as oracles) are excluded.

  Not recognised: a quantifier inside the class (`\[(x)?\]`) and a box spelled
  through an escape class (`\[[\s]*x\]`).

  Scope: hand-authored TypeScript/TSX outside lib/src. Tests, fixtures, the
  generated plugin bundle and the kernel itself are excluded — the parity suite
  deliberately keeps the PRE-FIX parsers as oracles, and the kernel is where the
  grammar belongs.
files:
  - "**/*.ts"
  - "**/*.tsx"
ignores:
  - "lib/src/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "**/__fixtures__/**"
  - "fixtures/**"
  - "e2e/**"
  - "smoke/**"
  - "test/**"
  - "labs/**"
  - ".opencode/plugins/arggon/**"
  - "opencode/plugins/arggon/index.bundle.ts"
  - "tools/ast-grep/**"
rule:
  kind: regex
  regex: '\[[()| \txX]+\\?\]'
