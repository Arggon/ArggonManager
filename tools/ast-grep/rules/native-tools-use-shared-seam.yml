id: native-tools-use-shared-seam
language: Tsx
severity: error
message: Native tool definitions must be added through the shared Arggon catalog seam.
note: |
  Rationale: TOOL_SPECS/WORKTREE_TOOL_SPECS feed both executable definitions and
  schema parity checks. This is a high-confidence structural guard, not semantic
  data-flow analysis.
  Scope: hand-authored Arggon plugin sources only. The generated bundle, vendored
  .opencode files, and tests are excluded; unrelated repository modules are not
  searched by this rule.
  Exception: the canonical transform call and its one editor.add payload are
  recognized only when registerArgonTools directly binds definitions to
  argonToolDefinitions(...) and transform to ctx?.tool?.transform, the transform
  call contains the definitions loop, and the payload has ...definition plus
  namespace: ARGON_TOOL_NAMESPACE and codemode: true. Deliberate computed,
  destructured, or otherwise indirect aliases are outside structural scope; the
  plugin's schema/parity tests remain authoritative.
  Receiver names are structural anchors with the same limitation: a renamed but
  type-valid receiver (toolEditor.add beside a real ToolEditor) is not covered,
  because generic $X.add shapes would reintroduce generic-name false positives.
  Plugin schema/parity tests remain the authoritative check there too.
files:
  - "opencode/plugins/arggon/**/*.ts"
  - "opencode/plugins/arggon/**/*.tsx"
ignores:
  - "opencode/plugins/arggon/index.bundle.ts"
  - ".opencode/plugins/arggon/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
rule:
  any:
    - pattern: ctx.tool.transform($$$DIRECT_ARGS)
    - pattern: ctx?.tool?.transform($$$OPTIONAL_ARGS)
    - pattern: ctx.tool.add($$$ADD_CALL_ARGS)
    - pattern: ctx.tool.register($$$REGISTER_CALL_ARGS)
    - all:
        - pattern: const transform = ctx?.tool?.transform
        - not:
            inside:
              all:
                - kind: function_declaration
                - has:
                    field: name
                    regex: "^registerArgonTools$"
                - has:
                    pattern: const definitions = argonToolDefinitions($$$DEFS_ALIAS)
                    stopBy: end
                - has:
                    pattern: const transform = ctx?.tool?.transform
                    stopBy: end
              stopBy: end
    - all:
        - pattern: transform($$$TRANSFORM_ALIAS_ARGS)
        - not:
            all:
              - inside:
                  all:
                    - kind: function_declaration
                    - has:
                        field: name
                        regex: "^registerArgonTools$"
                    - has:
                        pattern: const definitions = argonToolDefinitions($$$DEFS_TRANSFORM)
                        stopBy: end
                    - has:
                        pattern: const transform = ctx?.tool?.transform
                        stopBy: end
                  stopBy: end
              - has:
                  kind: for_in_statement
                  has:
                    field: right
                    pattern: definitions
                  stopBy: end
    - all:
        - pattern: editor.add($$$EDITOR_ADD_OUT_ARGS)
        - not:
            inside:
              all:
                - kind: for_in_statement
                - has:
                    field: right
                    pattern: definitions
                - inside:
                    all:
                      - kind: call_expression
                      - has:
                          field: function
                          pattern: transform
                      - inside:
                          all:
                            - kind: function_declaration
                            - has:
                                field: name
                                regex: "^registerArgonTools$"
                            - has:
                                pattern: const definitions = argonToolDefinitions($$$DEFS_ADD_OUT)
                                stopBy: end
                            - has:
                                pattern: const transform = ctx?.tool?.transform
                                stopBy: end
                          stopBy: end
                    stopBy: end
              stopBy: end
    - all:
        - pattern: editor.add($$$EDITOR_ADD_IN_ARGS)
        - inside:
            all:
              - kind: for_in_statement
              - has:
                  field: right
                  pattern: definitions
              - inside:
                  all:
                    - kind: call_expression
                    - has:
                        field: function
                        pattern: transform
                    - inside:
                        all:
                          - kind: function_declaration
                          - has:
                              field: name
                              regex: "^registerArgonTools$"
                          - has:
                              pattern: const definitions = argonToolDefinitions($$$DEFS_ADD_IN)
                              stopBy: end
                          - has:
                              pattern: const transform = ctx?.tool?.transform
                              stopBy: end
                        stopBy: end
                  stopBy: end
            stopBy: end
        - not:
            all:
              - has:
                  kind: spread_element
                  regex: '^\.\.\.definition$'
                  stopBy: end
              - has:
                  kind: pair
                  regex: '^\s*options\s*:'
                  stopBy: end
              - has:
                  kind: pair
                  regex: '^\s*namespace\s*:\s*ARGON_TOOL_NAMESPACE\s*,?$'
                  stopBy: end
              - has:
                  kind: pair
                  regex: '^\s*codemode\s*:\s*true\s*,?$'
                  stopBy: end
    - all:
        - pattern: editor.namespace($$$NAMESPACE_ARGS)
        - not:
            all:
              - pattern: "editor.namespace({ name: ARGON_TOOL_NAMESPACE, description: ARGON_TOOL_NAMESPACE_DESCRIPTION })"
              - inside:
                  all:
                    - kind: call_expression
                    - has:
                        field: function
                        pattern: transform
                    - inside:
                        all:
                          - kind: function_declaration
                          - has:
                              field: name
                              regex: "^registerArgonTools$"
                          - has:
                              pattern: const definitions = argonToolDefinitions($$$DEFS_NAMESPACE)
                              stopBy: end
                          - has:
                              pattern: const transform = ctx?.tool?.transform
                              stopBy: end
                        stopBy: end
                  stopBy: end
    - all:
        - pattern: for (const $LOOP_ITEM of definitions) { $$$LOOP_BODY }
        - not:
            inside:
              all:
                - kind: call_expression
                - has:
                    field: function
                    pattern: transform
                - inside:
                    all:
                      - kind: function_declaration
                      - has:
                          field: name
                          regex: "^registerArgonTools$"
                      - has:
                          pattern: const definitions = argonToolDefinitions($$$DEFS_LOOP)
                          stopBy: end
                      - has:
                          pattern: const transform = ctx?.tool?.transform
                          stopBy: end
                    stopBy: end
              stopBy: end
    - pattern: tool({ $$$TOOL_FIELDS })
    - all:
        - pattern: import { $$$TOOL_IMPORTS } from "@opencode/plugin"
        - has:
            kind: import_specifier
            regex: '\btool\b'
            stopBy: end
