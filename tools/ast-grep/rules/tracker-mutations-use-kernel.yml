id: tracker-mutations-use-kernel
language: Tsx
severity: error
message: Tracker item mutations must go through the shared @arggondev/lib kernel.
note: |
  Rationale: adapters must not compose or persist item frontmatter themselves. The
  kernel owns locking, status/claim rules, validation, cascades, and tracker commits.
  Only path arguments are inspected: write/unlink/truncate use their first path,
  while rename checks its source and destination paths. Content arguments are never
  scanned. A bare filePath/outputPath is intentionally not a tracker signal, and
  ArggonManager/docs product paths are explicitly excluded.
  Scope: hand-authored TypeScript/TSX outside lib/src. Tests and fixture harnesses,
  generated or vendored plugin files, and the kernel itself are excluded.
  Exception: lib/src is the shared mutation kernel. cli/src/layout-migrate.ts has
  one inline, documented ADR-0012 root-migration suppression; product-doc writes
  remain the owning CLI command's responsibility.
files:
  - "**/*.ts"
  - "**/*.tsx"
ignores:
  - "lib/src/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "**/__fixtures__/**"
  - "fixtures/**"
  - "e2e/**"
  - "smoke/**"
  - "test/**"
  - "labs/**"
  - "cli/src/test-tmp.ts"
  - "cli/src/pack-fixtures.ts"
  - ".opencode/plugins/arggon/**"
  - "opencode/plugins/arggon/index.bundle.ts"
  - "tools/ast-grep/**"
rule:
  any:
    - all:
        - pattern: import { $$$IMPORTS_SERIALIZE } from "@arggondev/lib"
        - has:
            kind: import_specifier
            regex: '\bstringifyFrontmatter\b'
            stopBy: end
    - pattern: stringifyFrontmatter($$$SERIALIZE_CALL_ARGS)
    - pattern: $KERNEL_SERIALIZE.stringifyFrontmatter($$$SERIALIZE_MEMBER_ARGS)
    - pattern: $WRITER_FIRST($PATH_FIRST, $$$REST_FIRST)
    - pattern: $WRITER_ONE($PATH_ONE)
constraints:
  WRITER_FIRST:
    regex: "^(writeFile|writeFileSync|appendFile|appendFileSync|writeFileAtomic|rename|renameSync)$"
  WRITER_ONE:
    regex: "^(rm|rmSync|unlink|unlinkSync|truncate|truncateSync)$"
  PATH_FIRST:
    all:
      - regex: '(?i)(initiative|epic|story|task|tracker|item)(file|path|dir|id|move|source|dest)|\.filePath$|(^|[/"])(initiative|epic|story|task|bug)(-[^/" ]+)?\.md($|[/"])|(join|resolve)\([^)]*(ArggonManager|tasks)[^)]*(initiative|epic|story|task|bug)(-[^/)]*)?\.md|(join|resolve)\([^)]*tasksDir[^)]*\.md'
      - not:
          regex: '(?i)(ArggonManager|tasks)[^\n)]*(docs|documentation)[^\n)]*'
  PATH_ONE:
    all:
      - regex: '(?i)(initiative|epic|story|task|tracker|item)(file|path|dir|id|move|source|dest)|\.filePath$|(^|[/"])(initiative|epic|story|task|bug)(-[^/" ]+)?\.md($|[/"])|(join|resolve)\([^)]*(ArggonManager|tasks)[^)]*(initiative|epic|story|task|bug)(-[^/)]*)?\.md|(join|resolve)\([^)]*tasksDir[^)]*\.md'
      - not:
          regex: '(?i)(ArggonManager|tasks)[^\n)]*(docs|documentation)[^\n)]*'
